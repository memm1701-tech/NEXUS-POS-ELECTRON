<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS POS - Gestión de Clientes</title>
    <script src="../../tailwindcss.js"></script>
    <link href="../../../node_modules/@fontsource/roboto/index.css" rel="stylesheet">
    <link href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="../../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        
        /* Asegura que el encabezado sea sólido al desplazar la tabla */
        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #f9fafb;
            box-shadow: inset 0 -1px 0 #e5e7eb;
        }

        /* Scrollbar estilo Nexus POS */
        .overflow-y-auto::-webkit-scrollbar { width: 6px; }
        .overflow-y-auto::-webkit-scrollbar-track { background: #f1f1f1; }
        .overflow-y-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-white overflow-hidden w-full h-full m-0 p-0"> 
    <main class="flex flex-col w-full h-screen bg-white"> 
        
        <div class="p-6 pb-2 shrink-0">
            <div class="flex justify-between items-end mb-6">
                <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                    <span class="material-icons text-blue-600 mr-3 text-4xl">person_pin</span>
                    Gestión de Clientes
                </h1>
            </div>

            <form id="client-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-white p-6 rounded-xl border border-gray-200 mb-4 shadow-sm relative z-20">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Cédula / RIF</label>
                    <input type="text" id="client-rif" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none uppercase sm:text-sm placeholder-gray-400 sm:text-sm placeholder-gray-400" placeholder="V-12345678" required>
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nombre o Razón Social</label>
                    <input type="text" id="client-name" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none uppercase sm:text-sm placeholder-gray-400" placeholder="Ej. Juan Pérez / Empresa C.A." required>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Teléfono</label>
                    <input type="text" id="client-phone" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm placeholder-gray-400" placeholder="Ej. 0414-1234567">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Correo Electrónico</label>
                    <input type="email" id="client-email" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm placeholder-gray-400" placeholder="Ej. cliente@empresa.com">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Dirección Fiscal</label>
                    <input type="text" id="client-address" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm placeholder-gray-400" placeholder="Dirección detallada del cliente...">
                </div>

                <div class="md:col-span-4 flex justify-end gap-3 mt-2">
                    <button type="button" id="btn-cancel-edit" class="hidden bg-gray-500 text-white py-2 px-6 rounded-md hover:bg-gray-600 font-bold transition duration-150 shadow-sm" title="Cancelar Edición">
                        <span class="material-icons align-middle text-sm mr-1">close</span> Cancelar
                    </button>
                    <button type="submit" id="btn-save-client" class="bg-blue-600 text-white py-2 px-8 rounded-md hover:bg-blue-700 font-bold transition duration-150 shadow-sm">
                        <span class="material-icons align-middle text-sm mr-1">save</span> <span id="btn-save-text">Guardar Cliente</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="flex-1 overflow-hidden px-6 pb-6 flex flex-col">
            <div class="flex-1 bg-white border border-gray-200 rounded-xl shadow-sm flex flex-col overflow-hidden relative z-10">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h3 class="text-lg font-semibold text-gray-800">Directorio Local de Clientes</h3>
                </div>
                
                <div class="flex-1 overflow-y-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0 z-10">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cédula / RIF</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre / Razón Social</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teléfono</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dirección</th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clients-table-body" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                                    <div class="flex flex-col items-center justify-center">
                                        <span class="material-icons text-4xl mb-2 text-gray-300">person_off</span>
                                        <p>No hay clientes registrados localmente.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        // --- 1. ESTADO GLOBAL ---
        let companyId = null;
        let editingClientRif = null;

        // Referencias DOM
        const clientForm = document.getElementById('client-form');
        const clientsTableBody = document.getElementById('clients-table-body');
        const btnSaveText = document.getElementById('btn-save-text');
        const btnCancelEdit = document.getElementById('btn-cancel-edit');
        const rifInput = document.getElementById('client-rif');

        // --- 2. INICIALIZACIÓN ---
        async function initModuloClientes() {
            try {
                const sesion = await window.nexusAPI.obtenerSesionLocal();
                if (sesion) {
                    companyId = sesion.companyId;
                    console.log("-> Conexión con SQLite establecida (Clientes).");
                    fetchClients(); 
                } else {
                    showCustomAlert("Error de sesión local.", 'error');
                }
            } catch (error) {
                console.error("Error al iniciar módulo:", error);
            }
        }

        // --- 3. LÓGICA CRUD ---
        async function fetchClients() {
            try {
                const clientes = await window.nexusAPI.obtenerClientesLocal();
                renderClients(clientes);
            } catch (error) {
                console.error("Error cargando clientes:", error);
                showCustomAlert("Error al leer SQLite.", 'error');
            }
        }

        async function saveClient(e) {
            e.preventDefault();
            
            const clientData = {
                rif: document.getElementById('client-rif').value.trim().toUpperCase(),
                nombre: document.getElementById('client-name').value.trim(),
                direccion: document.getElementById('client-address').value.trim(),
                telefono: document.getElementById('client-phone').value.trim(),
                correo: (document.getElementById('client-email')?.value || '').trim(),
                company_id: companyId
            };

            try {
                const resultado = await window.nexusAPI.guardarClienteLocal(clientData);
                
                if (resultado && !resultado.error) {
                    showCustomAlert(editingClientRif ? "Cliente actualizado." : "Cliente guardado.", 'success');
                    cancelEdit(); // Limpia el formulario
                    fetchClients(); // Refresca la tabla
                } else {
                    throw new Error(resultado.error);
                }
            } catch (error) {
                showCustomAlert("Error al guardar cliente.", 'error');
                console.error(error);
            }
        }

        async function deleteClient(rif, nombre) {
            if (confirm(`¿Seguro que deseas eliminar al cliente ${nombre} (${rif})?`)) {
                try {
                    const res = await window.nexusAPI.eliminarClienteLocal(rif);
                    if (res && !res.error) {
                        showCustomAlert("Cliente eliminado.", 'success');
                        fetchClients();
                    } else {
                        throw new Error(res.error);
                    }
                } catch (error) {
                    showCustomAlert("Fallo al eliminar.", 'error');
                }
            }
        }

        // --- 4. CONTROL DE EDICIÓN ---
        function editClient(client) {
            editingClientRif = client.rif;
            
            document.getElementById('client-rif').value = client.rif;
            document.getElementById('client-name').value = client.nombre || '';
            document.getElementById('client-address').value = client.direccion || '';
            document.getElementById('client-phone').value = client.telefono && client.telefono !== '00000000000' ? client.telefono : '';
            if (document.getElementById('client-email')) {
                document.getElementById('client-email').value = client.correo && client.correo !== 'sin@correo.com' && client.correo !== 'S/C' ? client.correo : '';
            }
            
            // Bloqueamos el input del RIF para que no pueda cambiar la clave primaria
            rifInput.disabled = true;
            rifInput.classList.add('bg-gray-100', 'text-gray-500');

            btnSaveText.textContent = 'Actualizar Cliente';
            btnCancelEdit.classList.remove('hidden');
        }

        function cancelEdit() {
            clientForm.reset();
            editingClientRif = null;
            
            rifInput.disabled = false;
            rifInput.classList.remove('bg-gray-100', 'text-gray-500');
            
            btnSaveText.textContent = 'Guardar Cliente';
            btnCancelEdit.classList.add('hidden');
        }

        // --- 5. RENDERIZADO ---
        function renderClients(clientes) {
            clientsTableBody.innerHTML = '';
            
            if (!clientes || clientes.length === 0) {
                clientsTableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                            <div class="flex flex-col items-center justify-center">
                                <span class="material-icons text-4xl mb-2 text-gray-300">person_off</span>
                                <p>No hay clientes registrados localmente.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            clientes.forEach(c => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50 border-b border-gray-100 transition-colors";
                
                tr.innerHTML = `
                    <td class="px-6 py-4 text-sm font-medium text-blue-700">${c.rif}</td>
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">${c.nombre}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${c.telefono && c.telefono !== '00000000000' ? c.telefono : 'N/A'}</td>
                    <td class="px-6 py-4 text-sm text-gray-500 truncate max-w-xs">${c.direccion || 'N/A'}</td>
                    <td class="px-6 py-4 text-right space-x-3">
                        <button class="edit-btn bg-yellow-400 hover:bg-yellow-500 text-gray-900 py-1.5 px-3 rounded-md text-xs font-bold transition-colors shadow-sm"><i class="fas fa-edit"></i> Editar</button>
                        <button class="delete-btn bg-red-600 hover:bg-red-700 text-white py-1.5 px-3 rounded-md text-xs font-bold transition-colors shadow-sm"><i class="fas fa-trash-alt"></i> Borrar</button>
                    </td>
                `;

                tr.querySelector('.edit-btn').onclick = () => editClient(c);
                tr.querySelector('.delete-btn').onclick = () => deleteClient(c.rif, c.nombre);
                clientsTableBody.appendChild(tr);
            });
        }

        // --- 6. UTILIDADES ---
        function showCustomAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.innerHTML = `<span class="material-icons mr-2 align-middle">${type === 'success' ? 'check_circle' : 'error'}</span><span class="align-middle">${message}</span>`;
            const bgColor = type === 'success' ? '#10B981' : '#EF4444'; // Verde o Rojo
            alertDiv.style.cssText = `
                position: fixed; top: 20px; right: 20px;
                background-color: ${bgColor}; color: white; padding: 15px 25px; 
                border-radius: 8px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
                z-index: 1000; transition: opacity 0.5s ease;
            `;
            document.body.appendChild(alertDiv);
            setTimeout(() => { alertDiv.style.opacity = '0'; setTimeout(() => alertDiv.remove(), 500); }, 3000);
        }

        // Eventos
        clientForm.addEventListener('submit', saveClient);
        btnCancelEdit.addEventListener('click', cancelEdit);

        // Arrancar
        initModuloClientes();
    </script>
</body>
</html>
