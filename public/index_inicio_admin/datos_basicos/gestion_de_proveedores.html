<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS POS - Gestión de Proveedores</title>
    <script src="../../tailwindcss.js"></script>
    <link href="../../../node_modules/@fontsource/roboto/index.css" rel="stylesheet">
    <link href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="../../../node_modules/material-icons/iconfont/material-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        
        /* Asegura que el encabezado sea sólido al desplazar la tabla */
        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #f9fafb;
            box-shadow: inset 0 -1px 0 #e5e7eb;
        }

        /* Scrollbar estilo Nexus POS */
        .overflow-y-auto::-webkit-scrollbar { width: 6px; }
        .overflow-y-auto::-webkit-scrollbar-track { background: #f1f1f1; }
        .overflow-y-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-white overflow-hidden w-full h-full m-0 p-0"> 
    <main class="flex flex-col w-full h-screen bg-white"> 
        
        <div class="p-6 pb-2 shrink-0">
            <div class="flex justify-between items-end mb-6">
                <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                    <span class="material-icons text-blue-600 mr-3 text-4xl">local_shipping</span>
                    Gestión de Proveedores
                </h1>
            </div>

            <!-- Formulario de Proveedores (Mismo orden que Clientes, estilo Cuentas por Cobrar) -->
            <form id="provider-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-white p-6 rounded-xl border border-gray-200 mb-4 shadow-sm relative z-20">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Cédula / RIF</label>
                    <input type="text" id="prov-rif" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none uppercase sm:text-sm placeholder-gray-400 sm:text-sm placeholder-gray-400" placeholder="J-12345678" required>
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nombre o Razón Social</label>
                    <input type="text" id="prov-name" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none uppercase sm:text-sm placeholder-gray-400" placeholder="Ej. Distribuidora XYZ C.A." required>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Teléfono</label>
                    <input type="text" id="prov-phone" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm placeholder-gray-400" placeholder="Ej. 0414-1234567">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Persona de Contacto</label>
                    <input type="text" id="prov-contact" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm placeholder-gray-400" placeholder="Ej. Carlos Vendedor" required>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Dirección Fiscal</label>
                    <input type="text" id="prov-address" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm placeholder-gray-400" placeholder="Dirección detallada del proveedor...">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Correo Electrónico</label>
                    <input type="email" id="prov-email" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm placeholder-gray-400" placeholder="pagos@proveedor.com">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tipo Contribuyente</label>
                    <select id="prov-tax-type" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm bg-white">
                        <option value="ORDINARIO">Ordinario (IVA)</option>
                        <option value="ESPECIAL">Contribuyente Especial</option>
                        <option value="FORMAL">Contribuyente Formal / Exento</option>
                        <option value="NO_DOMICILIADO">No Domiciliado</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">% Retención IVA</label>
                    <select id="prov-ret-iva" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm bg-white">
                        <option value="75">75% (Estándar RIF)</option>
                        <option value="100">100% (Sin RIF / Especial)</option>
                        <option value="0">0% (Exento / No Aplica)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Concepto ISLR Default (D. 1808)</label>
                    <select id="prov-islr-code" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm bg-white">
                        <option value="">Ninguno / Manual</option>
                        <option value="001">001 - Honorarios Profesionales (PN 3% / PJ 5%)</option>
                        <option value="053">053 - Contratistas / Obras y Servicios (PN 1% / PJ 2%)</option>
                        <option value="011">011 - Fletes y Transporte Nacional (PN 1% / PJ 3%)</option>
                        <option value="015">015 - Arrendamiento Inmuebles (PN 3% / PJ 5%)</option>
                        <option value="016">016 - Arrendamiento Muebles/Equipos (PN 3% / PJ 5%)</option>
                        <option value="022">022 - Publicidad y Mercadeo (PN 3% / PJ 5%)</option>
                        <option value="026">026 - Comisiones Mercantiles (PN 1% / PJ 2%)</option>
                        <option value="030">030 - Mantenimiento y Reparación (PN 1% / PJ 2%)</option>
                        <option value="008">008 - Seguros y Reaseguros (PN 1% / PJ 3%)</option>
                        <option value="055">055 - Tecnología y Consultoría (PN 3% / PJ 5%)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Días de Crédito Default</label>
                    <input type="number" id="prov-credit-days" min="0" value="15" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Banco Receptor</label>
                    <select id="prov-bank" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm bg-white">
                        <option value="">-- Seleccionar --</option>
                        <option value="BANESCO">Banesco</option>
                        <option value="MERCANTIL">Mercantil</option>
                        <option value="PROVINCIAL">BBVA Provincial</option>
                        <option value="BDV">Banco de Venezuela</option>
                        <option value="BNC">BNC</option>
                        <option value="BANCARIBE">Bancaribe</option>
                        <option value="EXTERIOR">Banco Exterior</option>
                        <option value="OTRO">Otro Banco Nacional</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Cuenta Bancaria (20 dígitos)</label>
                    <input type="text" id="prov-bank-account" maxlength="20" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm font-mono placeholder-gray-400" placeholder="01340000000000000000">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">RIF Titular Cuenta</label>
                    <input type="text" id="prov-account-rif" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm uppercase placeholder-gray-400" placeholder="J-00000000-0">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Teléfono Pago Móvil</label>
                    <input type="text" id="prov-pago-movil" class="w-full border border-gray-300 rounded-md p-2.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none sm:text-sm placeholder-gray-400" placeholder="04140000000">
                </div>

                <div class="flex items-center pt-5">
                    <label class="inline-flex items-center gap-2 text-sm font-semibold text-gray-700 cursor-pointer">
                        <input type="checkbox" id="prov-aplica-islr" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span>Aplica Retención ISLR por Defecto</span>
                    </label>
                </div>

                <div class="md:col-span-4 flex justify-end gap-3 mt-2">
                    <button type="button" id="btn-cancelar" class="hidden bg-gray-500 text-white py-2 px-6 rounded-md hover:bg-gray-600 font-bold transition duration-150">
                        <span class="material-icons align-middle text-sm mr-1">close</span> Cancelar
                    </button>
                    <button type="submit" id="btn-guardar" class="bg-blue-600 text-white py-2 px-8 rounded-md hover:bg-blue-700 font-bold transition duration-150 shadow-sm">
                        <span class="material-icons align-middle text-sm mr-1">save</span> Guardar Proveedor
                    </button>
                </div>
            </form>
        </div>
        
        <div class="flex-1 overflow-hidden px-6 pb-6 flex flex-col">
            <!-- Contenedor de la tabla, estilo Cuentas por Cobrar -->
            <div class="flex-1 bg-white border border-gray-200 rounded-xl shadow-sm flex flex-col overflow-hidden relative z-10">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h3 class="text-lg font-semibold text-gray-800">Directorio de Proveedores</h3>
                    <div class="relative w-64">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="material-icons text-sm">search</i>
                        </span>
                        <input type="text" id="search-prov" placeholder="Buscar proveedor..." class="w-full pl-9 pr-3 py-1.5 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm outline-none">
                    </div>
                </div>
                
                <div class="flex-1 overflow-y-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">RIF / C.I.</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Razón Social / Fiscal</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Banco / Retenciones</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contacto & Crédito</th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="prov-table-body" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                                    <div class="flex flex-col items-center justify-center">
                                        <span class="material-icons text-4xl mb-2 text-gray-300">inventory_2</span>
                                        <p>No hay proveedores registrados aún.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script type="module">

        function showCustomAlert(message, type = 'success', duration = 3000) {
            const div = document.createElement('div');
            div.textContent = message;
            div.style.cssText = `position:fixed; top:20px; right:20px; background:${type==='error'?'#f44336': (type==='warning'?'#ff9800':'#4CAF50')}; color:white; padding:15px; border-radius:5px; z-index:1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: 'Roboto', sans-serif;`;
            document.body.appendChild(div);
            if (duration > 0) setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.5s';
                setTimeout(() => div.remove(), 500);
            }, duration);
            return div;
        }
    
        let companyId = null;
        let isEditing = false;

        const BANCOS_CODIGO_VE = {
            BANESCO: '0134',
            MERCANTIL: '0105',
            PROVINCIAL: '0108',
            BDV: '0102',
            BNC: '0191',
            BANCARIBE: '0114',
            EXTERIOR: '0115',
            OTRO: ''
        };

        const rifInput = document.getElementById('prov-rif');
        const form = document.getElementById('provider-form');
        const tableBody = document.getElementById('prov-table-body');
        const searchInput = document.getElementById('search-prov');
        const btnGuardar = document.getElementById('btn-guardar');
        const btnCancelar = document.getElementById('btn-cancelar');

        async function init() {
            const sesion = await window.nexusAPI.obtenerSesionLocal();
            if (sesion) {
                companyId = sesion.companyId;
                fetchProveedores();
                if (window.nexusAPI?.sincronizarCuentasPagar) {
                    window.nexusAPI.sincronizarCuentasPagar(companyId).then(() => fetchProveedores()).catch(console.error);
                }
            }
        }

        rifInput.addEventListener('input', function(e) {
            let rawValue = this.value.replace(/[^0-9]/g, '');
            if (rawValue.length > 10) rawValue = rawValue.slice(0, 10);
            if (rawValue.length > 0) {
                if (rawValue.length < 9) {
                    this.value = 'V-' + rawValue;
                } else {
                    this.value = 'J-' + rawValue;
                }
            } else {
                this.value = '';
            }
        });

        async function fetchProveedores() {
            try {
                const proveedoresRaw = await window.nexusAPI.obtenerProveedoresLocal(companyId);
                const proveedores = (proveedoresRaw || []).filter(p => !companyId || p.company_id === companyId);
                renderTable(proveedores);
            } catch (err) {
                console.error("Error obteniendo proveedores:", err);
            }
        }

        function renderTable(proveedores) {
            tableBody.innerHTML = '';
            
            if (!proveedores || proveedores.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                            <div class="flex flex-col items-center justify-center">
                                <span class="material-icons text-4xl mb-2 text-gray-300">inventory_2</span>
                                <p>No hay proveedores registrados aún.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            const filterText = searchInput.value.toLowerCase();
            const filtered = proveedores.filter(p => 
                p.rif.toLowerCase().includes(filterText) ||
                p.nombre.toLowerCase().includes(filterText) ||
                (p.contacto && p.contacto.toLowerCase().includes(filterText)) ||
                (p.banco_nombre && p.banco_nombre.toLowerCase().includes(filterText))
            );

            filtered.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50 border-b border-gray-100 transition-colors";
                const taxBadge = p.tipo_contribuyente === 'ESPECIAL'
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-purple-100 text-purple-800">Especial</span>`
                    : (p.tipo_contribuyente === 'FORMAL'
                        ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-gray-100 text-gray-700">Formal</span>`
                        : `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-100 text-blue-700">${p.tipo_contribuyente || 'Ordinario'}</span>`);
                const retPct = p.porcentaje_retencion_iva != null ? Number(p.porcentaje_retencion_iva) : 75;
                const islrBadge = p.aplica_islr_default ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-amber-100 text-amber-800">ISLR ${p.codigo_islr_default || 'Sí'}</span>` : '';
                const bankInfo = p.banco_nombre
                    ? `<div class="text-xs font-semibold text-gray-700">${p.banco_nombre}</div><div class="text-[11px] text-gray-500 font-mono">${p.cuenta_bancaria ? '••••' + String(p.cuenta_bancaria).slice(-4) : (p.telefono_pago_movil || '')}</div>`
                    : `<span class="text-xs text-gray-400">Sin cuenta bancaria</span>`;
                const saldoFavor = Number(p.saldo_a_favor_usd || 0);
                const saldoBadge = saldoFavor > 0.009
                    ? `<div class="inline-flex items-center mt-1 px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-700">Saldo a favor $${saldoFavor.toFixed(2)}</div>`
                    : '';

                tr.innerHTML = `
                    <td class="px-6 py-4 text-sm font-medium text-blue-700 font-mono">${p.rif}</td>
                    <td class="px-6 py-4 text-sm">
                        <div class="font-medium text-gray-900">${p.nombre}</div>
                        <div class="flex flex-wrap gap-1 mt-1">${taxBadge} <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-sky-100 text-sky-800">Ret. IVA ${retPct}%</span> ${islrBadge}</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">${bankInfo}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">
                        <div>${p.telefono || 'N/A'} · <span class="text-gray-500">${p.contacto || 'N/A'}</span></div>
                        <div class="text-xs text-gray-500">Crédito: ${p.dias_credito_default ?? 15}d</div>
                        ${saldoBadge}
                    </td>
                    <td class="px-6 py-4 text-right space-x-2 whitespace-nowrap">
                        <button type="button" class="edit-btn bg-amber-500 hover:bg-amber-600 text-white py-1.5 px-3 rounded-md text-xs font-bold transition-colors shadow-sm"><span class="material-icons text-xs align-middle mr-0.5">edit</span> Editar</button>
                        <button type="button" class="delete-btn bg-red-600 hover:bg-red-700 text-white py-1.5 px-3 rounded-md text-xs font-bold transition-colors shadow-sm"><i class="fas fa-trash-alt"></i> Borrar</button>
                    </td>
                `;

                tr.querySelector('.edit-btn').onclick = () => editProveedor(p);
                tr.querySelector('.delete-btn').onclick = () => deleteProveedor(p.rif, p.nombre);
                tableBody.appendChild(tr);
            });
        }

        function editProveedor(p) {
            isEditing = true;
            document.getElementById('prov-rif').value = p.rif || '';
            document.getElementById('prov-rif').readOnly = true;
            document.getElementById('prov-rif').classList.add('bg-gray-100');
            document.getElementById('prov-name').value = p.nombre || '';
            document.getElementById('prov-phone').value = p.telefono || '';
            document.getElementById('prov-contact').value = p.contacto || '';
            document.getElementById('prov-address').value = p.direccion || '';
            document.getElementById('prov-email').value = p.correo || '';
            document.getElementById('prov-tax-type').value = p.tipo_contribuyente || 'ORDINARIO';
            document.getElementById('prov-ret-iva').value = String(p.porcentaje_retencion_iva ?? 75);
            document.getElementById('prov-islr-code').value = p.codigo_islr_default || '';
            document.getElementById('prov-credit-days').value = p.dias_credito_default ?? 15;
            document.getElementById('prov-bank').value = p.banco_nombre || '';
            document.getElementById('prov-bank-account').value = p.cuenta_bancaria || '';
            document.getElementById('prov-account-rif').value = p.rif_titular_cuenta || '';
            document.getElementById('prov-pago-movil').value = p.telefono_pago_movil || '';
            document.getElementById('prov-aplica-islr').checked = Boolean(Number(p.aplica_islr_default));
            btnGuardar.innerHTML = '<span class="material-icons align-middle text-sm mr-1">save</span> Actualizar Proveedor';
            btnCancelar.classList.remove('hidden');
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function cancelEditProveedor() {
            isEditing = false;
            form.reset();
            document.getElementById('prov-rif').readOnly = false;
            document.getElementById('prov-rif').classList.remove('bg-gray-100');
            document.getElementById('prov-ret-iva').value = '75';
            document.getElementById('prov-credit-days').value = '15';
            btnGuardar.innerHTML = '<span class="material-icons align-middle text-sm mr-1">save</span> Guardar Proveedor';
            btnCancelar.classList.add('hidden');
        }

        btnCancelar.addEventListener('click', cancelEditProveedor);

        async function saveProveedor(e) {
            e.preventDefault();
            const bancoNombre = document.getElementById('prov-bank').value.trim();
            const cuenta = document.getElementById('prov-bank-account').value.replace(/\D/g, '').slice(0, 20);
            if (cuenta && cuenta.length !== 20) {
                showCustomAlert("La cuenta bancaria debe tener exactamente 20 dígitos o quedar vacía", "warning");
                return;
            }
            const provData = {
                company_id: companyId,
                rif: document.getElementById('prov-rif').value.trim(),
                nombre: document.getElementById('prov-name').value.trim().toUpperCase(),
                telefono: document.getElementById('prov-phone').value.trim(),
                contacto: document.getElementById('prov-contact').value.trim(),
                direccion: document.getElementById('prov-address').value.trim(),
                correo: document.getElementById('prov-email').value.trim(),
                tipo_contribuyente: document.getElementById('prov-tax-type').value,
                porcentaje_retencion_iva: parseFloat(document.getElementById('prov-ret-iva').value || 75),
                aplica_islr_default: document.getElementById('prov-aplica-islr').checked ? 1 : 0,
                codigo_islr_default: document.getElementById('prov-islr-code').value.trim(),
                banco_codigo: cuenta ? cuenta.slice(0, 4) : (BANCOS_CODIGO_VE[bancoNombre] || ''),
                banco_nombre: bancoNombre,
                cuenta_bancaria: cuenta,
                rif_titular_cuenta: document.getElementById('prov-account-rif').value.trim().toUpperCase(),
                telefono_pago_movil: document.getElementById('prov-pago-movil').value.trim(),
                dias_credito_default: Math.max(0, parseInt(document.getElementById('prov-credit-days').value || 15, 10))
            };

            const res = await window.nexusAPI.guardarProveedorLocal(provData);
            if (res.success) {
                showCustomAlert(isEditing ? "Proveedor actualizado correctamente" : "Proveedor guardado correctamente", "success");
                cancelEditProveedor();
                fetchProveedores();
            } else {
                showCustomAlert("Error al guardar: " + res.error, "error");
            }
        }

        async function deleteProveedor(rif, nombre) {
            if (confirm(`¿Seguro que deseas eliminar al proveedor ${nombre} (${rif})?`)) {
                const res = await window.nexusAPI.eliminarProveedorLocal(rif, companyId);
                if (res.success) {
                    fetchProveedores();
                } else {
                    showCustomAlert("Error eliminando: " + res.error, "error");
                }
            }
        }

        form.addEventListener('submit', saveProveedor);
        searchInput.addEventListener('input', fetchProveedores);

        init();
    </script>
</body>
</html>
